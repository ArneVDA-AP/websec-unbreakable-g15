title = "Gitleaks config websec-unbreakable-g15"

[extend]
useDefault = true

[[rules]]
id = "hardcoded-password-config"
description = "Hardcoded password in a config file"
regex = '''(?i)(?:password|passwd|pwd|passphrase)["']?\s*[:=]\s*["']?([^\s"'$\{<][^\s"';,]{2,})'''
secretGroup = 1
path = '''(?i)(\.(ya?ml|json|env|ini|conf|cfg|config|toml|xml|properties)$|(^|/)\.env[^/]*$|(^|/)Dockerfile[^/]*$)'''

[[rules]]
id = "hardcoded-password-literal"
description = "Password assigned a hardcoded string literal"
regex = '''(?i)(?:password|passwd|pwd|passphrase)\w*["']?\s*[:=]\s*["']([^"'\s$\{<]{3,})["']'''
secretGroup = 1

[[rules]]
id = "hardcoded-password-connstring"
description = "Password inside a connection string in code"
regex = '''(?i)[;"']\s*(?:password|pwd)\s*=\s*([^;"'\s$\{<]{3,})'''
secretGroup = 1
path = '''(?i)\.(cs|cshtml|razor|js|ts|py|sh|ps1|sql|java|go|php|rb)$'''

[allowlist]
description = "Build output and placeholders"
paths = [
  '''(^|/)(bin|obj)/''',
  '''packages\.lock\.json$''',
]
regexes = [
  '''(?i)^(\*+|x{3,}|redacted|<[^>]*>)$''',
]
